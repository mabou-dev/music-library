version: "2.3"

services:
    backend:
        build:
            context: backend
            dockerfile: ../backend.Dockerfile
        ports:
          - "8080:8080"
        networks:
          - app-network
        command: ./server start

    frontend:
        build: 
            context: frontend
            dockerfile: ../frontend.Dockerfile
        ports:
          - "3000:3000"
        networks:
          - app-network
        command: npm start

    nginx:
        image: nginx:latest
        volumes:
          - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        ports:
          - "80:80"
        depends_on:
          - frontend
          - backend
        networks:
          - app-network

networks:
    app-network:
        driver: bridge
